<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Baby ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Main Container */
        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Background Gradient */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #000000 0%, #2a0845 50%, #6b1b47 100%);
            z-index: -10;
        }

        /* Animated Glow Background */
                .glow-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -5;
            background: radial-gradient(circle at 50% 50%, rgba(255, 107, 154, 0.15) 0%, transparent 50%);
            animation: glowPulse 8s ease-in-out infinite alternate;
            will-change: transform;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(5%, 5%); }
        }

        /* Floating Elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            will-change: transform, opacity;
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float linear infinite;
        }

        .sparkle {
            will-change: transform, opacity;
            position: absolute;
            font-size: 0.75rem;
            opacity: 0.4;
            animation: sparkleFloat linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--tx, 0px));
                opacity: 0;
            }
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--tx, 0px));
                opacity: 0;
            }
        }

        /* Content Container */
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            animation: fadeInContent 1.5s ease-in forwards;
        }

        @keyframes fadeInContent {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Text Container */
        .text-container {
            text-align: center;
            max-width: 800px;
            margin-bottom: 4rem;
        }

        .text-line {
            margin-bottom: 2rem;
            opacity: 0;
            animation: textAppear 0.5s ease-in forwards;
        }

        .text-line.line-1 {
            animation-delay: 0s;
        }

        .text-line.line-2 {
            animation-delay: 2.5s;
        }

        .text-line.line-3 {
            animation-delay: 5s;
        }

        @keyframes textAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .line-1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #ff6b9a;
            text-shadow: 0 0 20px rgba(255, 107, 154, 0.6);
        }

        .line-2 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #c8a2ff;
            text-shadow: 0 0 15px rgba(200, 162, 255, 0.5);
            font-weight: 300;
        }

        .line-3 {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #fff5f8;
            text-shadow: 0 0 10px rgba(255, 245, 248, 0.4);
            font-weight: 300;
        }

        /* Typewriter cursor */
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: currentColor;
            margin-left: 0.1em;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        /* Button */
        .start-button {
            margin-top: 4rem;
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b9a 0%, #c8a2ff 100%);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 107, 154, 0.5), 0 0 60px rgba(200, 162, 255, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            animation: buttonAppear 0.5s ease-in forwards;
            animation-delay: 7.5s;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        @keyframes buttonAppear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .start-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c8a2ff 0%, #ff6b9a 100%);
            transition: left 0.4s ease;
            z-index: -1;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .content {
                padding: 15px;
            }
            .text-container {
                margin-bottom: 2rem;
            }
            .start-button {
                margin-top: 2rem;
                padding: 0.8rem 2rem;
                font-size: 1.1rem;
            }
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 107, 154, 0.8), 0 0 80px rgba(200, 162, 255, 0.5);
        }

        .start-button:hover::before {
            left: 0;
        }

        .start-button:active {
            transform: scale(0.95);
        }



        /* Footer */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.875rem;
            color: #fff5f8;
            z-index: 10;
            animation: fadeInContent 1s ease-in 1s forwards;
            opacity: 0;
        }

        .heartbeat {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.2);
            }
            50% {
                transform: scale(1);
            }
        }

        /* Fade out animation */
        .fade-out {
            animation: fadeOut 1s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .text-container {
                margin-bottom: 3rem;
            }



            .footer {
                font-size: 0.75rem;
            }
        }
    </style>
    <link href="music-system.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Background -->
        <div class="background"></div>
        <div class="glow-bg"></div>

        <!-- Floating Elements -->
        <div class="floating-elements" id="floatingContainer"></div>



        <!-- Main Content -->
        <div class="content">
            <div class="text-container">
                <!-- Line 1 -->
                <div class="text-line line-1">
                    <span class="line-1" id="line1"></span>
                </div>

                <!-- Line 2 -->
                <div class="text-line line-2">
                    <span class="line-2" id="line2"></span>
                </div>

                <!-- Line 3 -->
                <div class="text-line line-3">
                    <span class="line-3" id="line3"></span>
                </div>
            </div>

            <!-- Button -->
            <button class="start-button" id="startButton">Start Our Journey 💖</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Made with endless love</span>
            <span class="heartbeat">❤️</span>
            <span>by Taiyaba</span>
        </div>
    </div>

    <script>
        // Typewriter Effect
        function typeWriter(element, text, speed = 80) {
            return new Promise((resolve) => {
                let index = 0;
                element.innerHTML = '';

                function type() {
                    if (index < text.length) {
                        element.innerHTML += text.charAt(index);
                        index++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        // Initialize floating hearts and sparkles
        function createFloatingElements() {
            const container = document.getElementById('floatingContainer');

            // Create hearts
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = (Math.random() * 100) + '%';
                heart.style.fontSize = (20 + Math.random() * 15) + 'px';
                const duration = 8 + Math.random() * 4;
                const delay = Math.random() * 5;
                const tx = (Math.random() - 0.5) * 100;
                heart.style.animation = `float ${duration}s linear ${delay}s infinite`;
                heart.style.setProperty('--tx', tx + 'px');
                container.appendChild(heart);
            }

            // Create sparkles
            for (let i = 0; i < 10; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✨';
                sparkle.style.left = (Math.random() * 100) + '%';
                const duration = 12 + Math.random() * 4;
                const delay = i * 0.8;
                const tx = (Math.random() - 0.5) * 100;
                sparkle.style.animation = `sparkleFloat ${duration}s linear ${delay}s infinite`;
                sparkle.style.setProperty('--tx', tx + 'px');
                container.appendChild(sparkle);
            }
        }

        // Typewriter sequence
        async function startTypewriter() {
            await typeWriter(document.getElementById('line1'), 'Hey Baby... ❤️', 80);
            await new Promise(r => setTimeout(r, 1200));

            await typeWriter(document.getElementById('line2'), 'I made something for you...', 80);
            await new Promise(r => setTimeout(r, 1200));

            await typeWriter(document.getElementById('line3'), 'Not just a website... but us. 💫', 80);
            await new Promise(r => setTimeout(r, 1800));
        }



        // Button Click Handler
        const startButton = document.getElementById('startButton');
        startButton.addEventListener('click', () => {
            // Play click sound
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);

            // Fade out and redirect
            document.querySelector('.container').classList.add('fade-out');

            setTimeout(() => {
                // Change to cake page
                window.location.href = 'cake-page.html';
            }, 1000);
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingElements();
            startTypewriter();
        });
    </script>
    <script src="music-system.js"></script>
</body>
</html>
