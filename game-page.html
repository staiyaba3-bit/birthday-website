<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Quiz ❤️ How Well Do You Know Us?</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0a1e;
            --bg-gradient: linear-gradient(135deg, #0f0a1e 0%, #1a0b2e 100%);
            --accent-pink: #ff6b9a;
            --accent-purple: #c8a2ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 20px rgba(255, 107, 154, 0.3);
            --success-glow: 0 0 20px rgba(46, 213, 115, 0.4);
            --error-glow: 0 0 20px rgba(255, 71, 87, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Background Animations --- */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            color: var(--accent-pink);
            opacity: 0.2;
            filter: blur(1px);
            animation: floatUp var(--duration) linear infinite;
            font-size: var(--size);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.2;
            }

            90% {
                opacity: 0.2;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            will-change: transform, opacity;
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.5);
            }
        }

        /* --- Layout --- */
        .page-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* --- Header --- */
        .header-section {
            margin-bottom: 2.5rem;
        }

        .header-section h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            color: var(--accent-pink);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(255, 107, 154, 0.5);
        }

        .header-section p {
            font-size: 1.1rem;
            color: var(--accent-purple);
            min-height: 1.6em;
            opacity: 0.9;
        }

        /* --- Quiz Card --- */
        .quiz-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: clamp(1.5rem, 5vw, 2.5rem);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .quiz-card.hidden {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
        }

        /* --- Progress Bar --- */
        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--accent-purple);
            margin-bottom: 0.6rem;
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            width: 0%;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px var(--accent-pink);
        }

        /* --- Question --- */
        .question-title {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 600;
            margin-bottom: 2rem;
            line-height: 1.4;
            color: #fff;
        }

        .options-grid {
            display: grid;
            gap: 1rem;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 1.1rem;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-family: inherit;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-pink);
            transform: translateY(-2px);
            box-shadow: var(--neon-glow);
        }

        .option-btn.correct {
            background: rgba(46, 213, 115, 0.2);
            border-color: #2ed573;
            box-shadow: var(--success-glow);
            transform: scale(1.02);
        }

        .option-btn.wrong {
            background: rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
            box-shadow: var(--error-glow);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-4px);
            }
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .option-btn.reveal-correct {
            background: rgba(46, 213, 115, 0.1);
            border-color: #2ed573;
            opacity: 1 !important;
        }

        /* --- Next Button --- */
        .next-btn-container {
            margin-top: 2rem;
            height: 50px;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(255, 107, 154, 0.3);
        }

        .next-btn.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .next-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 107, 154, 0.4);
        }

        /* --- Result Screen --- */
        .result-screen {
            display: none;
        }

        .result-screen.active {
            display: block;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-pink);
            margin: 1rem 0;
            text-shadow: 0 0 20px rgba(255, 107, 154, 0.4);
        }

        .result-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #eee;
            line-height: 1.6;
        }

        .unlock-btn {
            background: white;
            color: var(--bg-dark);
            border: none;
            padding: 1.1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .unlock-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
        }

        /* --- Popup --- */
        .feedback-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            padding: 2rem 3rem;
            border-radius: 30px;
            border: 1px solid var(--accent-pink);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .feedback-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-popup h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: var(--accent-pink);
            margin-bottom: 0.5rem;
        }



        /* --- Particles --- */
        .particle {
            will-change: transform, opacity;
            position: fixed;
            pointer-events: none;
            z-index: 99;
        }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            .quiz-card { padding: 2rem; }
            .header-section h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            .page-container { padding: 15px; }
            .quiz-card { padding: 1.5rem; }
            .question-title { font-size: 1.3rem; margin-bottom: 1.5rem; }
            .option-btn { padding: 1rem; font-size: 1rem; }
            .header-section h1 { font-size: 2.5rem; }
            .back-btn { top: 10px; left: 10px; padding: 0.6rem 1.2rem; font-size: 0.8rem; }
        }

        @media (max-width: 480px) {
            .question-title { font-size: 1.1rem; }
            .option-btn { padding: 0.8rem; font-size: 0.9rem; }
            .header-section h1 { font-size: 2rem; }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-pink);
            transform: translateX(-5px);
            box-shadow: var(--neon-glow);
        }
    </style>
    <link href="music-system.css" rel="stylesheet">
</head>

<body>

    <div class="bg-elements" id="bgElements"></div>

    <a href="memories-page.html" class="back-btn">
        <span>←</span> Back to Memories
    </a>

    <div class="page-container">
        <!-- Header Section -->
        <header class="header-section">
            <h1 id="mainTitle">How Well Do You Know Us? 😌❤️</h1>
            <p id="subTitle"></p>
        </header>

        <!-- Quiz Screen -->
        <main class="quiz-card" id="quizCard">
            <div id="quizContent">
                <div class="progress-container">
                    <div class="progress-info">
                        <span id="currentQuestionNum">Question 1/5</span>
                        <span id="progressPercent">20%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <h2 class="question-title" id="questionText">Loading question...</h2>

                <div class="options-grid" id="optionsGrid">
                    <!-- Options will be injected here -->
                </div>

                <div class="next-btn-container">
                    <button class="next-btn" id="nextBtn">Next Question →</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div class="result-screen" id="resultScreen">
                <h2 style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--accent-pink);">Our Story
                    Score</h2>
                <div class="final-score" id="finalScore">5/5</div>
                <p class="result-message" id="resultMessage"></p>
                <button class="unlock-btn" id="unlockBtn">Unlock Something Special 🔒❤️</button>
            </div>
        </main>
    </div>

    <!-- Feedback Popup -->
    <div class="feedback-popup" id="feedbackPopup">
        <h3 id="popupTitle">That’s my boy 😌❤️</h3>
        <p id="popupMessage">You really know me!</p>
    </div>



    <script>
        const quizData = [
            {
                question: "What do I call you the most?",
                options: ["Love", "Baby ❤️", "Oye", "Idiot 😏"],
                correct: 1
            },
            {
                question: "What do you love more?",
                options: ["Food 🍔", "Sleep 😴", "Me 😌❤️", "Coding 💻"],
                correct: 2
            },
            {
                question: "Who says sorry first?",
                options: ["You ❤️", "Me 😭", "Depends 😏", "No one 😂"],
                correct: 0
            },
            {
                question: "What makes me happiest?",
                options: [
                    "When you take care of me",
                    "When you listen to me",
                    "When you stay no matter what",
                    "All of these ❤️"
                ],
                correct: 3
            },
            {
                question: "What are we?",
                options: [
                    "Just cute",
                    "Best couple 😌",
                    "Soulmates ❤️",
                    "Forever ♾️"
                ],
                correct: [2, 3]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // --- Background Elements ---
        function initBackground() {
            const container = document.getElementById('bgElements');

            // Floating Hearts
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.setProperty('--duration', (15 + Math.random() * 10) + 's');
                heart.style.setProperty('--size', (15 + Math.random() * 20) + 'px');
                heart.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(heart);
            }

            // Twinkling Sparkles
            for (let i = 0; i < 40; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.width = sparkle.style.height = (1 + Math.random() * 2) + 'px';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
                sparkle.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(sparkle);
            }
        }

        // --- Typewriter Effect ---
        function typeWriter(element, text, speed = 80) {
            let i = 0;
            element.textContent = '';
            let lastTime = 0;
            function type(time) {
                if (!lastTime) lastTime = time;
                if (time - lastTime >= speed) {
                    element.textContent += text.charAt(i);
                    i++;
                    lastTime = time;
                }
                if (i < text.length) {
                    requestAnimationFrame(type);
                }
            }
            requestAnimationFrame(type);
        }

        // --- Quiz Logic ---
        function loadQuestion() {
            const quizCard = document.getElementById('quizCard');
            const question = quizData[currentQuestion];

            // Update Progress
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('currentQuestionNum').textContent = `Question ${currentQuestion + 1}/${quizData.length}`;

            // Update Text
            document.getElementById('questionText').textContent = question.question;

            // Update Options
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            question.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOption(idx, btn);
                grid.appendChild(btn);
            });

            // Reset UI
            answered = false;
            document.getElementById('nextBtn').classList.remove('show');
            quizCard.classList.remove('hidden');
        }

        function selectOption(index, btn) {
            if (answered) return;
            answered = true;

            const question = quizData[currentQuestion];
            const options = document.querySelectorAll('.option-btn');
            const isCorrect = Array.isArray(question.correct)
                ? question.correct.includes(index)
                : index === question.correct;

            if (isCorrect) {
                score++;
                btn.classList.add('correct');
                showFeedback(true);
                createHeartBurst(btn);
            } else {
                btn.classList.add('wrong');
                // Show the correct answer(s)
                if (Array.isArray(question.correct)) {
                    question.correct.forEach(i => options[i].classList.add('reveal-correct'));
                } else {
                    options[question.correct].classList.add('reveal-correct');
                }
                showFeedback(false);
            }

            options.forEach(opt => opt.classList.add('disabled'));

            setTimeout(() => {
                document.getElementById('nextBtn').classList.add('show');
            }, 800);
        }

        function showFeedback(isCorrect) {
            const popup = document.getElementById('feedbackPopup');
            const title = document.getElementById('popupTitle');
            const msg = document.getElementById('popupMessage');

            if (isCorrect) {
                title.textContent = "That’s my boy 😌❤️";
                msg.textContent = "You really know me!";
            } else {
                title.textContent = "Wrong index… but I’ll keep you 😏❤️";
                msg.textContent = "Let's make more memories!";
            }

            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 1800);
        }

        function createHeartBurst(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = '❤️';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.fontSize = (10 + Math.random() * 15) + 'px';

                const angle = (i / 12) * Math.PI * 2;
                const velocity = 100 + Math.random() * 100;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${vx}px, ${vy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 500,
                    easing: 'cubic-bezier(0.1, 0.8, 0.4, 1)'
                }).onfinish = () => particle.remove();

                document.body.appendChild(particle);
            }
        }

        function showResults() {
            document.getElementById('quizContent').style.display = 'none';
            const screen = document.getElementById('resultScreen');
            const scoreDisplay = document.getElementById('finalScore');
            const msgDisplay = document.getElementById('resultMessage');

            screen.classList.add('active');
            scoreDisplay.textContent = `${score}/${quizData.length}`;

            if (score === quizData.length) {
                msgDisplay.textContent = "You really know my heart 🥺❤️ Every single detail. You're truly my soulmate!";
            } else if (score >= 3) {
                msgDisplay.textContent = "You know me pretty well 😌 but there's still so much more for us to discover together!";
            } else {
                msgDisplay.textContent = "We need more cute memories together 🥺 and more time spent just talking and loving.";
            }

            // Confetti effect
            for (let i = 0; i < 3; i++) {
                setTimeout(createConfetti, i * 500);
            }
        }

        function createConfetti() {
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerHTML = ['✨', '🎉', '❤️', '💖'][Math.floor(Math.random() * 4)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = '-20px';
                p.style.fontSize = (15 + Math.random() * 20) + 'px';

                p.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.random() * 200 - 100}px, 110vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: 'linear'
                }).onfinish = () => p.remove();

                document.body.appendChild(p);
            }
        }

        // --- Interaction ---
        document.getElementById('nextBtn').onclick = () => {
            const card = document.getElementById('quizCard');
            card.classList.add('hidden');
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                    card.classList.remove('hidden');
                }
            }, 600);
        };



        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            initBackground();
            typeWriter(document.getElementById('subTitle'), "Only real soulmates can score full 😏");
            setTimeout(loadQuestion, 800);
        });

        document.getElementById('unlockBtn').onclick = () => {
            // Fade out and redirect
            document.body.style.transition = 'opacity 1s';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'final-page.html';
            }, 1000);
        };
    </script>
    <script src="music-system.js"></script>
</body>

</html>
